name: Set up just
description: >-
  Install a pinned just release by direct download and verify its checksum.
  Replaces extractions/setup-just, which resolves releases through the GitHub
  API on every run and intermittently fails with "no release for just matching
  version specifier".

runs:
  using: composite
  steps:
    - name: Install just 1.40.0
      shell: bash
      env:
        JUST_VERSION: "1.40.0"
        # From casey/just's SHA256SUMS for this release.
        JUST_SHA256: 181b91d0ceebe8a57723fb648ed2ce1a44d849438ce2e658339df4f8db5f1263
      run: |
        set -euo pipefail
        archive="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
          "https://github.com/casey/just/releases/download/${JUST_VERSION}/${archive}"
        echo "${JUST_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/just-bin"
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/just-bin" just
        echo "$RUNNER_TEMP/just-bin" >> "$GITHUB_PATH"
