# Build and publish release binaries with GoReleaser on a version tag.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Produces cross-compiled archives + checksums and attaches them to a GitHub
# Release. No external secrets — the built-in GITHUB_TOKEN creates the release.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
