[project]
name = "wikisync"
version = "0.1.0"
description = "Work with MediaWiki/Appropedia pages locally — pull, edit, diff, and push like git, but for wikis."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Cameron Brooks" }]
dependencies = [
    "mwclient>=0.10.1",
]

[project.scripts]
wikisync = "wikisync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikisync"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.11",
    "pyright>=1.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
